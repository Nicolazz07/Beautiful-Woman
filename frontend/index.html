<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Woman | Tienda de Moda</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Iconos y tipografía -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Navegación -->
    <header class="navbar">
        <div class="logo">
            <h1>Beautiful Woman</h1>
        </div>
        <nav class="nav-links">
            <a href="#">Inicio</a>
            <a href="#catalogo">Catálogo</a>
            <a href="#">Reseñas</a>
        </nav>
        <div class="nav-icons">
            <i class="fas fa-search"></i>
            <i class="fas fa-heart"></i>
            <i class="fas fa-shopping-bag"></i>
        </div>
    </header>

    <!-- Banner Principal -->
    <section class="hero">
        <div class="hero-content">
            <h2>Moda hecha con propósito</h2>
            <p>Descubre la nueva colección con estilos únicos para ti.</p>
            <button class="btn-primary">Ver Colección</button>
        </div>
    </section>

    <!-- Sección de Catálogo -->
    <main id="catalogo" class="catalogo-section">
        <h2 class="section-title">Novedades</h2>
        <!-- Aquí se inyectarán las tarjetas de productos desde JavaScript -->
        <div id="grid-productos" class="grid-productos">
            <p id="loading">Cargando catálogo de prendas...</p>
        </div>
    </main>

    <!-- Conectar la lógica de JS -->
    <script src="js/app.js"></script>
</body>
</html>
