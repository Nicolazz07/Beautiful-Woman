<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Woman | Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="split-layout">
        
        <!-- Mitad Izquierda (Fondo Rosa) -->
        <div class="split-left">
            <h2 class="login-logo">Beautiful Woman</h2>
            <div class="quote-container">
                <h3>“La moda se desvanece,<br>el estilo es eterno.”</h3>
                <p>Bienvenida de nuevo a tu espacio de moda favorito.</p>
            </div>
            <p class="copyright">© 2026 Beautiful Woman</p>
        </div>

        <!-- Mitad Derecha (Formulario) -->
        <div class="split-right">
            <div class="form-container">
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus datos para acceder a tu cuenta</p>
                
                <form id="form-login">
                    <div class="input-group">
                        <label>Correo electrónico</label>
                        <input type="email" placeholder="tunombre@email.com" required>
                    </div>
                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <div class="options-group">
                        <label><input type="checkbox"> Recordarme</label>
                    </div>
                    <button type="submit" class="btn-dark btn-full">Iniciar Sesión</button>
                </form>
                
                <div class="divider"><span>o continúa con</span></div>
                
                <div class="social-login">
                    <button class="btn-outline">Google</button>
                    <button class="btn-outline">Facebook</button>
                </div>
                
                <p class="switch-form">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </div>
        
    </div>
    <script src="js/app.js"></script>
    <script>
    const formLogin = document.getElementById('form-login');

    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault(); // Evitamos que la página se recargue

        alert('Paso 1: El botón sí funciona y el evento arrancó');

        // Capturamos el correo y la contraseña
        const correo = formLogin.querySelectorAll('input')[0].value;
        const contrasena = formLogin.querySelectorAll('input')[1].value;

        alert('Paso 2: Datos capturados -> ' + correo);

        try {
            // Enviamos los datos al backend
            const respuesta = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ correo, contrasena })
            });

            const datos = await respuesta.json();

            if (respuesta.ok) {
                // Saludamos a la clienta
                alert('¡Bienvenida de nuevo, ' + datos.usuario.nombre + '!');
                
                // Guardamos su nombre en la memoria del navegador por si lo necesitamos después
                localStorage.setItem('usuarioLogueado', datos.usuario.nombre);
                
                // LA LÍNEA MÁGICA: Redirecciona a la página principal
                window.location.href = 'index.html';
            } else {
                alert(datos.error);
            }
        } catch (error) {
            console.error('Error de conexión:', error);
            alert('No se pudo conectar con el servidor.');
        }
        
    });
</script>
</body>
</html>
