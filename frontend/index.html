<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Woman | Moda y Elegancia</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navegación -->
    <header class="navbar">
        <div class="logo">
            <h1>Beautiful Woman</h1>
        </div>
        <nav class="nav-links">
            <a href="#">Inicio</a>
            <a href="#catalogo">Catálogo</a>
            <a href="#">Reseñas</a>
            <a href="#">Nosotros</a>
        </nav>
        <div class="nav-actions">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Buscar productos...">
            </div>
            <i class="far fa-heart"></i>
            <i class="fas fa-shopping-cart"></i>
            <button class="btn-cuenta">Mi cuenta</button>
        </div>
    </header>

    <!-- Banner Principal -->
    <section class="hero">
        <div class="hero-text">
            <span class="tag-coleccion">NUEVA COLECCIÓN 2026</span>
            <h2>Moda y Elegancia Femenina</h2>
            <p>Descubre prendas pensadas para resaltar tu belleza natural, con diseños exclusivos hechos en Colombia.</p>
            <button class="btn-dark">Explorar Colección &rarr;</button>
        </div>
        <div class="hero-image">
            <!-- Imagen simulada del mockup -->
            <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600" alt="Modelo con blusa">
        </div>
    </section>

    <!-- Sección de Catálogo -->
    <main id="catalogo" class="catalogo-section">
        <div class="catalogo-header">
            <h2>Destacados y Novedades</h2>
            <p>Los artículos más recientes y más vendidos de la temporada</p>
        </div>
        <div id="grid-productos" class="grid-productos">
            <!-- JS inyectará las tarjetas aquí -->
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
